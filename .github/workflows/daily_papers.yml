name: Daily Paper Digest

on:
  # Every day at 06:00 UTC (= 15:00 KST)
  schedule:
    - cron: "0 6 * * *"

  # Allow manual trigger with an optional date override
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      skip_arxiv:
        description: "Skip arXiv scraper (faster run)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the report back to the repo

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Python
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # 3. Build digest
      # ------------------------------------------------------------------ #
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "value=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run paper finder
        env:
          SS_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          SKIP_FLAGS=""
          if [ "${{ github.event.inputs.skip_arxiv }}" = "true" ]; then
            SKIP_FLAGS="$SKIP_FLAGS --skip-arxiv"
          fi
          python main.py --date "${{ steps.date.outputs.value }}" $SKIP_FLAGS

      # ------------------------------------------------------------------ #
      # 4. Commit & push the report
      # ------------------------------------------------------------------ #
      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || \
            git commit -m "digest: daily paper report ${{ steps.date.outputs.value }}"
          git push
