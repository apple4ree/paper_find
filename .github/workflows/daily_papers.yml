name: Daily Paper Digest

on:
  # Every day at 09:00 UTC (= 18:00 KST)
  # HuggingFace publishes its daily paper list around 08:00 UTC
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      skip_arxiv:
        description: "Skip arXiv scraper (faster run, fewer papers)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_s2:
        description: "Skip Semantic Scholar scraper"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_openreview:
        description: "Skip OpenReview scraper (ICLR/NeurIPS/ICML)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_hf:
        description: "Skip HuggingFace scraper"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------ #
      # 2. Python
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------ #
      # 3. Build digest
      # ------------------------------------------------------------------ #
      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "value=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run paper finder
        id: finder
        env:
          SS_API_KEY:         ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          HF_TOKEN:           ${{ secrets.HF_TOKEN }}
          OPENREVIEW_USER:    ${{ secrets.OPENREVIEW_USER }}
          OPENREVIEW_PASS:    ${{ secrets.OPENREVIEW_PASS }}
        run: |
          SKIP_FLAGS=""
          [ "${{ github.event.inputs.skip_arxiv }}"      = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-arxiv"
          [ "${{ github.event.inputs.skip_s2 }}"         = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-s2"
          [ "${{ github.event.inputs.skip_openreview }}" = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-openreview"
          [ "${{ github.event.inputs.skip_hf }}"         = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-hf"

          python main.py --date "${{ steps.date.outputs.value }}" $SKIP_FLAGS | tee /tmp/digest_summary.txt
          echo "summary_file=/tmp/digest_summary.txt" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 4. Commit & push the report
      # ------------------------------------------------------------------ #
      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || \
            git commit -m "digest: daily paper report ${{ steps.date.outputs.value }}"
          git push

      # ------------------------------------------------------------------ #
      # 5. Print summary as job summary
      # ------------------------------------------------------------------ #
      - name: Write job summary
        if: always()
        run: |
          echo "## Paper Digest — ${{ steps.date.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/digest_summary.txt 2>/dev/null || echo "(no output)"
          cat /tmp/digest_summary.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
