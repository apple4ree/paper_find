name: Daily Paper Digest

on:
  # 09:00 UTC = 18:00 KST  — HuggingFace daily papers are published ~08:00 UTC
  # 21:00 UTC = 06:00 KST  — second run catches papers added later in the day
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 21 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      skip_arxiv:
        description: "Skip arXiv scraper (faster run)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_s2:
        description: "Skip Semantic Scholar scraper"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_openreview:
        description: "Skip OpenReview scraper (ICLR/NeurIPS/ICML)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_cvf:
        description: "Skip CVF OpenAccess scraper (CVPR)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_aaai:
        description: "Skip AAAI Digital Library scraper"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "value=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run paper finder
        env:
          SS_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          SKIP_FLAGS=""
          [ "${{ github.event.inputs.skip_arxiv }}"    = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-arxiv"
          [ "${{ github.event.inputs.skip_s2 }}"       = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-s2"
          [ "${{ github.event.inputs.skip_openreview }}" = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-openreview"
          [ "${{ github.event.inputs.skip_cvf }}"      = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-cvf"
          [ "${{ github.event.inputs.skip_aaai }}"     = "true" ] && SKIP_FLAGS="$SKIP_FLAGS --skip-aaai"
          python main.py --date "${{ steps.date.outputs.value }}" $SKIP_FLAGS

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || \
            git commit -m "digest: daily paper report ${{ steps.date.outputs.value }}"
          git push
